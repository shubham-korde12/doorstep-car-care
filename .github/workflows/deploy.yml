name: Deploy DOORSTEP CAR CARE

on:
  push:
    branches:
      - develop
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Switch GitHub Pages to Actions deployment
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPOSITORY: ${{ github.repository }}
        run: |
          response_code="$(curl --silent --show-error --output /tmp/pages-response.json --write-out '%{http_code}' \
            --request PUT \
            --url "https://api.github.com/repos/${GH_REPOSITORY}/pages" \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            --header "Content-Type: application/json" \
            --data '{"build_type":"workflow"}')"

          if [ "${response_code}" -lt 200 ] || [ "${response_code}" -ge 300 ]; then
            echo "Could not switch GitHub Pages to workflow deployment (HTTP ${response_code})."
            cat /tmp/pages-response.json
            exit 1
          fi
          echo "GitHub Pages is configured for workflow deployment."

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload website files
        uses: actions/upload-pages-artifact@v4
        with:
          path: .

      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
